<!doctype html>
<html lang="en">
<head>
  <title>Razorpay Test</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <button onclick="pay()">Pay ₹40</button>
  <pre id="status"></pre>

  <script>
    const status = document.getElementById("status");

    function showStatus(message) {
      status.textContent = message;
    }

    async function pay() {
      const token = window.prompt("Paste a valid JWT token:");
      if (!token) {
        showStatus("A JWT token is required to create the Razorpay order.");
        return;
      }

      try {
        const response = await fetch("/api/razorpay/checkout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token.trim()
          },
          body: JSON.stringify({
            orderId: 1,
            amount: 40,
            currencyType: "INR"
          })
        });

        const responseBody = await response.text();
        if (!response.ok) {
          throw new Error(`Order creation failed (${response.status}): ${responseBody}`);
        }

        const data = JSON.parse(responseBody);
        const options = {
          key: data.keyId,
          amount: data.amount,
          currency: data.currencyType,
          order_id: data.orderId,
          name: "Test Store",
          description: "Test payment",
          handler: function (paymentResponse) {
            console.log("Payment successful:", paymentResponse);
            showStatus("Payment completed. Waiting for the Razorpay webhook...");
          }
        };

        new Razorpay(options).open();
      } catch (error) {
        console.error(error);
        showStatus(error.message);
      }
    }
  </script>
</body>
</html>
